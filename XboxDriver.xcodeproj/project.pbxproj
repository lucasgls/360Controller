			name = "Set SYSX package type on .dext bundles";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# macOS 26 sysextd requires FinderInfo bytes 'SYSX' on .dext bundles.\n# This script applies the correct 4-byte OSType after every build.\nSYSEXT_DIR=\"${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Library/SystemExtensions\"\nif [ -d \"$SYSEXT_DIR\" ]; then\n  python3 - \"$SYSEXT_DIR\" << 'PYEOF'\nimport sys, ctypes, ctypes.util, os, glob\nlibc = ctypes.CDLL(ctypes.util.find_library('c'), use_errno=True)\ndata = b'SYSX' + b'\\x00' * 28\nbuf = ctypes.create_string_buffer(data)\nsysext_dir = sys.argv[1]\nfor dext in glob.glob(os.path.join(sysext_dir, '*.dext')):\n    ret = libc.setxattr(dext.encode(), b'com.apple.FinderInfo', buf,\n                        ctypes.c_size_t(32), ctypes.c_uint32(0), ctypes.c_int(0))\n    status = \"OK\" if ret == 0 else f\"FAIL errno={ctypes.get_errno()}\"\n    print(f\"[SYSX] {status}: {os.path.basename(dext)}\")\nPYEOF\nfi\n";
		};
